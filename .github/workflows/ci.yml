name: 'CI'
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: 'Install Node'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.tool-versions'

      - name: Restore cache
        uses: actions/cache@v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: 'Install Deps'
        run: npm ci

      - name: 'Test'
        id: test
        run: npm run test:coverage

      - name: Install Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          version-file: '.tool-versions'
          version-type: strict

      - name: Test server
        env:
          TEST_DATABASE_URL: ecto://postgres:postgres@localhost:5432/permaplanner_test
        run: mix deps.get && mix test

      - name: Verify the production release command
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://postgres:postgres@localhost:5432/permaplanner_test
          MCP_BASE_URL: https://permaplanner.example
        run: |
          mix release
          SECRET_KEY_BASE="$(openssl rand -hex 64)" _build/prod/rel/permaplanner/bin/permaplanner eval Permaplanner.Release.migrate

      - name: Upload reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 2

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Pass or fail
        if: ${{ steps.test.outcome == 'failure' }}
        uses: actions/github-script@v9.0.0
        with:
          script: core.setFailed('Tests failed!')
